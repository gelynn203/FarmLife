name: Build Farm Life APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o FarmLifeAndroidProject.zip -d extracted
          cp -r extracted/FarmLifeAndroidProject/. .
          rm -rf extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmLife-APK
          path: app/build/outputs/apk/debug/app-debug.apk
